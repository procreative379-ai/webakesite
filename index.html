<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEVCARD — Сайты за 7–10 дней. Без воды.</title>
  <style>
/* Personal-site kit — local styles. Imports the design system tokens. */
/* ============================================================
   Devcard Design System — Core tokens
   Dark-first, acid accent, sharp geometry, terminal DNA.
   ============================================================ */

@import url("https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800;900&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap");

:root {
  /* ---------- Color: canvas & neutrals ---------- */
  --canvas:        #0A0B0D;     /* near-black, faint blue cast */
  --canvas-raise:  #121316;     /* one step up — card surface  */
  --canvas-sink:   #050608;     /* one step down — footer/well */

  --neutral-900:   #1A1C20;
  --neutral-800:   #25282E;
  --neutral-700:   #3A3E46;
  --neutral-500:   #6B7079;
  --neutral-400:   #8E939C;
  --neutral-300:   #B5B9C0;
  --neutral-200:   #D5D8DC;
  --neutral-100:   #E8EAEC;

  --fg:            #F2F2EE;     /* slightly warm off-white   */
  --fg-muted:      #8E939C;
  --fg-faint:      #4A4E55;

  /* ---------- Color: accents ---------- */
  --accent:        #C8FF1F;     /* acid lime — primary accent */
  --accent-dim:    #9ECC18;
  --accent-ink:    #0A0B0D;     /* foreground that goes ON accent */

  --signal:        #FF4D2E;     /* alarm orange — revisions, edits */
  --signal-dim:    #CC3D24;

  /* ---------- Semantic ---------- */
  --bg:            var(--canvas);
  --bg-elev:       var(--canvas-raise);
  --bg-sink:       var(--canvas-sink);
  --border:        var(--neutral-800);
  --border-strong: var(--neutral-700);
  --border-accent: var(--accent);

  /* ---------- Light alt (rarely used) ---------- */
  --paper:         #F2F2EE;
  --paper-raise:   #FFFFFF;
  --ink:           #0A0B0D;

  /* ---------- Type: families ---------- */
  --font-display:  "Unbounded", "Space Grotesk", system-ui, sans-serif;
  --font-body:     "Manrope", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:     "JetBrains Mono", "SF Mono", Menlo, monospace;

  /* ---------- Type: scale (desktop; mobile scales down ~0.85x) ---------- */
  --fs-display-xl: clamp(64px, 11vw, 168px);   /* hero monster */
  --fs-display-l:  clamp(48px, 7vw, 104px);    /* section opener */
  --fs-display-m:  clamp(36px, 4.5vw, 72px);   /* sub-hero */
  --fs-h1:         clamp(32px, 3.5vw, 56px);
  --fs-h2:         clamp(26px, 2.6vw, 40px);
  --fs-h3:         clamp(20px, 1.8vw, 28px);
  --fs-h4:         18px;
  --fs-body-l:     20px;
  --fs-body:       16px;
  --fs-body-s:     14px;
  --fs-caption:    12px;
  --fs-mono-s:     12px;
  --fs-mono:       14px;

  --lh-tight:      0.92;
  --lh-display:    1.02;
  --lh-heading:    1.12;
  --lh-body:       1.55;
  --lh-loose:      1.7;

  --ls-display:    -0.03em;
  --ls-heading:    -0.015em;
  --ls-body:       0em;
  --ls-mono-cap:   0.08em;       /* mono uppercase tracking */

  /* ---------- Spacing (4px base) ---------- */
  --space-1:   4px;
  --space-2:   8px;
  --space-3:   12px;
  --space-4:   16px;
  --space-6:   24px;
  --space-8:   32px;
  --space-12:  48px;
  --space-16:  64px;
  --space-24:  96px;
  --space-32:  128px;
  --space-48:  192px;

  /* ---------- Radii — always 0. Sharp. ---------- */
  --radius-0:    0px;
  --radius-pill: 0px;   /* deliberate: even "pills" are square */
  /* The only exception: --radius-circle for one-off avatars */
  --radius-circle: 999px;

  /* ---------- Borders ---------- */
  --border-thin:    1px solid var(--border);
  --border-strong-rule: 1px solid var(--border-strong);
  --border-accent-rule: 2px solid var(--accent);
  --border-fg:      1px solid var(--fg);

  /* ---------- Shadows — almost none. Hard offset only. ---------- */
  --shadow-none:   none;
  --shadow-hard:   4px 4px 0 var(--accent);
  --shadow-hard-fg: 4px 4px 0 var(--fg);
  --shadow-hard-signal: 4px 4px 0 var(--signal);

  /* ---------- Motion ---------- */
  --ease-out-sharp: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-in-sharp:  cubic-bezier(0.4, 0, 1, 1);
  --ease-linear:    linear;

  --dur-micro:  180ms;
  --dur-ui:     320ms;
  --dur-reveal: 600ms;

  /* ---------- Grid ---------- */
  --col-count:    12;
  --gutter:       24px;
  --container:    1280px;
  --container-wide: 1440px;

  /* ---------- Layered z ---------- */
  --z-base:    0;
  --z-raise:   10;
  --z-nav:     100;
  --z-modal:   500;
  --z-cursor:  999;
}

/* ============================================================
   Semantic element styling — apply these classes for instant
   on-brand text without re-specifying tokens.
   ============================================================ */

.ds-canvas {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.ds-display-xl,
.ds-display-l,
.ds-display-m,
.ds-h1, .ds-h2, .ds-h3, .ds-h4 {
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: var(--ls-display);
  line-height: var(--lh-display);
  color: var(--fg);
  margin: 0;
  text-wrap: balance;
}

.ds-display-xl { font-size: var(--fs-display-xl); font-weight: 800; line-height: var(--lh-tight); }
.ds-display-l  { font-size: var(--fs-display-l);  font-weight: 800; line-height: var(--lh-tight); }
.ds-display-m  { font-size: var(--fs-display-m);  font-weight: 700; }
.ds-h1 { font-size: var(--fs-h1); letter-spacing: var(--ls-heading); line-height: var(--lh-heading); }
.ds-h2 { font-size: var(--fs-h2); letter-spacing: var(--ls-heading); line-height: var(--lh-heading); font-weight: 600; }
.ds-h3 { font-size: var(--fs-h3); letter-spacing: var(--ls-heading); line-height: var(--lh-heading); font-weight: 600; }
.ds-h4 { font-size: var(--fs-h4); letter-spacing: var(--ls-heading); line-height: var(--lh-heading); font-weight: 600; }

.ds-body-l { font-family: var(--font-body); font-size: var(--fs-body-l); line-height: var(--lh-loose); color: var(--fg); }
.ds-body   { font-family: var(--font-body); font-size: var(--fs-body);   line-height: var(--lh-body);  color: var(--fg); }
.ds-body-s { font-family: var(--font-body); font-size: var(--fs-body-s); line-height: var(--lh-body);  color: var(--fg-muted); }
.ds-caption { font-family: var(--font-body); font-size: var(--fs-caption); color: var(--fg-muted); }

.ds-mono {
  font-family: var(--font-mono);
  font-size: var(--fs-mono);
  font-feature-settings: "calt" 0, "liga" 0;
  letter-spacing: 0;
  color: var(--fg);
}
.ds-mono-cap {
  font-family: var(--font-mono);
  font-size: var(--fs-mono-s);
  text-transform: uppercase;
  letter-spacing: var(--ls-mono-cap);
  color: var(--fg-muted);
  font-weight: 500;
}

.ds-accent      { color: var(--accent); }
.ds-signal      { color: var(--signal); }
.ds-muted       { color: var(--fg-muted); }
.ds-faint       { color: var(--fg-faint); }

a.ds-link, .ds-link {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid currentColor;
  padding-bottom: 1px;
  transition: color var(--dur-micro) var(--ease-out-sharp),
              background var(--dur-micro) var(--ease-out-sharp);
}
a.ds-link:hover, .ds-link:hover {
  background: var(--accent);
  color: var(--accent-ink);
}

::selection {
  background: var(--accent);
  color: var(--accent-ink);
}


* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--canvas); }
body {
  font-family: var(--font-body);
  color: var(--fg);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  cursor: none;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; }

/* ----- Layout shell ----- */
.page { max-width: 1320px; margin: 0 auto; padding: 0 32px; }
@media (max-width: 720px){ .page{ padding: 0 20px; } }

/* ----- Custom cursor ----- */
.cursor {
  position: fixed; top: 0; left: 0; width: 12px; height: 20px;
  background: var(--accent); pointer-events: none; z-index: 999;
  transform: translate(-50%, -50%);
  transition: width 180ms var(--ease-out-sharp), height 180ms var(--ease-out-sharp), background 180ms;
  mix-blend-mode: difference;
}
.cursor.on-interactive { width: 28px; height: 28px; }
@media (max-width: 900px){
  body{ cursor: auto; }
  .cursor{ display:none; }
}

/* ----- Sections ----- */
section { padding: 96px 0; border-top: 1px solid var(--border); }
@media (max-width: 720px){ section{ padding: 64px 0; } }
section:first-of-type { border-top: 0; }

/* ----- Generic helpers ----- */
.section-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 48px; gap: 24px; flex-wrap: wrap;
}
.section-num {
  font-family: var(--font-mono); font-size: 12px;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--fg-muted);
}
.section-num .acc { color: var(--accent); }
.section-title {
  font-family: var(--font-display); font-weight: 700;
  font-size: var(--fs-display-m); letter-spacing: -0.02em; line-height: 1.05;
  margin: 0; max-width: 18ch;
}

/* ----- Buttons ----- */
.btn {
  font-family: var(--font-display); font-weight: 700; font-size: 14px;
  letter-spacing: 0.02em; text-transform: uppercase;
  padding: 16px 24px; border: 0; cursor: none;
  display: inline-flex; align-items: center; gap: 12px;
  transition: all 180ms var(--ease-out-sharp);
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { box-shadow: var(--shadow-hard-fg); transform: translate(-3px,-3px); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--fg); }
.btn.ghost:hover { background: var(--fg); color: var(--canvas); }
.btn.signal { background: var(--signal); color: var(--canvas); }
.btn.signal:hover { box-shadow: var(--shadow-hard-fg); transform: translate(-3px,-3px); }
.btn .arr { font-family: var(--font-mono); }

/* ----- Reveal: mask-up ----- */
@keyframes maskUp { 0% { transform: translateY(100%); } 100% { transform: translateY(0); } }
.mask { display: inline-block; overflow: hidden; vertical-align: bottom; }
.mask > span { display: inline-block; transform: translateY(0); animation: maskUp 0.7s var(--ease-out-sharp) both; }
.mask.delay-1 > span { animation-delay: 0.05s; }
.mask.delay-2 > span { animation-delay: 0.18s; }
.mask.delay-3 > span { animation-delay: 0.32s; }
.mask.delay-4 > span { animation-delay: 0.48s; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(200,255,31,.6); }
      100% { box-shadow: 0 0 0 8px rgba(200,255,31,0); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes slideHero {
      0%, 100% { transform: translateX(-100%); }
      50% { transform: translateX(330%); }
    }
    section + section { border-top: 1px solid var(--border); }
  </style>
</head>

  <script type="text/babel">

// Hero.jsx — display-XL headline, mono garnish, primary CTA, generative graphic

    (function(){
      const cursor = document.getElementById('cursor');
      let x = 0, y = 0, tx = 0, ty = 0;
      document.addEventListener('mousemove', (e) => { tx = e.clientX; ty = e.clientY; });
      function frame(){
        x += (tx - x) * 0.35;
        y += (ty - y) * 0.35;
        cursor.style.transform = `translate(${x - 6}px, ${y - 10}px)`;
        requestAnimationFrame(frame);
      }
      frame();
      const obs = new MutationObserver(() => {
        document.querySelectorAll('.interactive, button, a').forEach(el => {
          if (el.dataset.cursorBound) return;
          el.dataset.cursorBound = '1';
          el.addEventListener('mouseenter', () => cursor.classList.add('on-interactive'));
          el.addEventListener('mouseleave', () => cursor.classList.remove('on-interactive'));
        });
      });
      obs.observe(document.body, { childList: true, subtree: true });
    })();

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
